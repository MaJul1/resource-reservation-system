<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Reservation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="container">

  <div class="mt-3">
    <h3 id="add-reservation-title">Add New Reservation</h3>
    <hr>
    <div id="add-reservation-alert" class="alert d-none" role="alert"></div>

    <form id="add-reservation-form" novalidate>
      <h4 class="mb-3">Reservation Date and Time</h4>
      <div class="row mb-3">
        <div class="col">
          <label class="form-label" for="startDateInput">Start Date</label>
          <input id="startDateInput" class="form-control" type="date" required>
        </div>
        <div class="col">
          <label class="form-label" for="startTimeInput">Start Time</label>
          <input id="startTimeInput" class="form-control" type="time" required>
        </div>
      </div>
      <div class="row mb-3">
        <div class="col">
          <label class="form-label" for="endDateInput">End Date</label>
          <input id="endDateInput" class="form-control" type="date" required>
        </div>
        <div class="col">
          <label class="form-label" for="endTimeInput">End Time</label>
          <input id="endTimeInput" class="form-control" type="time" required>
        </div>
      </div>

      <h4 class="mb-3">User Information</h4>
      <div class="row mb-3">
        <div class="col">
          <label class="form-label" for="userFirstName">First Name</label>
          <input class="form-control" type="text" id="userFirstName" required>
        </div>
        <div class="col">
          <label class="form-label" for="userLastName">Last Name</label>
          <input class="form-control" type="text" id="userLastName" required>
        </div>
      </div>
      <div class="row mb-3">
        <div class="col">
          <label class="form-label" for="userEmail">Email</label>
          <input class="form-control" type="email" id="userEmail" required>
        </div>
        <div class="col">
          <label class="form-label" for="userPhone">Phone</label>
          <input class="form-control" type="tel" id="userPhone" required>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a id="cancelButton" class="btn btn-secondary" href="reservation.html">Cancel</a>
        <button id="saveButton" class="btn btn-primary" type="submit">Save</button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script type="module" src="js/add-reservation.js"></script>
</body>

</html>
