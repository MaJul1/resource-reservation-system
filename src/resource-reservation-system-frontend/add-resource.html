<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Resource</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="container">

  <div class="mt-3">
    <h3>Add New Resource</h3>
    <hr>

    <form>
      <h4 class="mb-3">Resource Information</h4>
      <div class="row mb-3">
        <div class="col">
          <label class="form-label" for="resourceName">Name</label>
          <input class="form-control" type="text" id="resourceName" required>
        </div>
      </div>
      <div class="row mb-3">
        <div class="col">
          <label class="form-label" for="resourceType">Type</label>
          <input class="form-control" type="text" id="resourceType" required>
        </div>
        <div class="col">
          <label class="form-label" for="resourceDescription">Description</label>
          <input class="form-control" type="text" id="resourceDescription" required>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a id="cancelButton" class="btn btn-secondary" href="resource.html">Cancel</a>
        <button id="saveButton" class="btn btn-primary" type="submit">Save</button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
