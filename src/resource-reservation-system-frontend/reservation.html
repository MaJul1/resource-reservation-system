<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</head>

<body class="mb-5">
  <!-- add modal -->
  <div class="modal fade modal-lg" id="addReservationModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5">Add New Reservation</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form>
            <h5>Resource Information</h5>
            <select class="form-select" aria-label="Default select example">
              <option selected>Open this select menu</option>
              <option value="1">Room 001</option>
            </select>
          </form>

        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <a href="add-reservation.html" class="btn btn-primary">Add</a>
        </div>
      </div>
    </div>
  </div>


  <!-- navbar -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Resource Reservation System</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="#">Reservation</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="resource.html">Resource</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- body -->
  <div class="container">

    <h3 class="mt-3">Reservations</h3>
    <hr>

    <div class="d-flex justify-content-end">
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addReservationModal">Add
        reservation</button>
    </div>
    <table id="reservation-table" class="table table-hover">
      <thead>
        <tr>
          <th>No.</th>
          <th>Resource Name</th>
          <th>Reserved By</th>
          <th>Start Date</th>
          <th>End Date</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="reservation-table-body">
        <tr>
          <td colspan="6" class="text-center">Loading reservations...</td>
        </tr>
      </tbody>
    </table>

    <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <label for="reservation-page-size" class="form-label mb-0">Rows per page</label>
        <select id="reservation-page-size" class="form-select form-select-sm w-auto">
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="50">50</option>
        </select>
      </div>

      <nav aria-label="Reservation pagination">
        <ul id="reservation-pagination" class="pagination pagination-sm mb-0"></ul>
      </nav>
    </div>
  </div>
</body>

<script type="module" src="js/reservation.js"></script>

</html>
