<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</head>

<body class="mb-5">
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Resource Reservation System</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="reservation.html">Reservation</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="resource.html">Resource</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-3">
    <div class="d-flex justify-content-between align-items-center">
      <h3 class="mb-0">Resource Detail</h3>
      <a href="resource.html" class="btn btn-outline-secondary btn-sm">Back to resources</a>
    </div>
    <hr>

    <div id="resource-detail-alert" class="alert alert-danger d-none" role="alert"></div>

    <h5>Resource Information</h5>
    <div class="row">
      <div class="col-md-6">
        <label class="form-label">Resource ID</label>
        <input id="resource-id" type="text" class="form-control" value="Loading..." disabled>
      </div>
      <div class="col-md-6 mt-3 mt-md-0">
        <label class="form-label">Name</label>
        <input id="resource-name" type="text" class="form-control" value="Loading..." disabled>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-6">
        <label class="form-label">Type</label>
        <input id="resource-type" type="text" class="form-control" value="Loading..." disabled>
      </div>
      <div class="col-md-6 mt-3 mt-md-0">
        <label class="form-label">Description</label>
        <input id="resource-description" type="text" class="form-control" value="Loading..." disabled>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-4">
      <h5 class="mb-0">Reservations</h5>
      <a id="add-reservation-link" class="btn btn-primary" href="#">Add Reservation</a>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>Reservation ID</th>
            <th>User</th>
            <th>Start</th>
            <th>End</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="resource-reservation-table-body">
          <tr>
            <td colspan="5" class="text-center">Loading reservations...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <label for="resource-detail-page-size" class="form-label mb-0">Rows per page</label>
        <select id="resource-detail-page-size" class="form-select form-select-sm w-auto">
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="50">50</option>
        </select>
      </div>

      <nav aria-label="Resource detail reservation pagination">
        <ul id="resource-detail-pagination" class="pagination pagination-sm mb-0"></ul>
      </nav>
    </div>
  </div>
</body>

<script type="module" src="js/resource-detail.js"></script>

</html>
