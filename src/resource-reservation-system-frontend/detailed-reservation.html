<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</head>

<body class="mb-5">

  <!-- navbar -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Resource Reservation System</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="reservation.html">Reservation</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Resource</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- body -->
  <div class="container">
    <h3>Reservation</h3>
    <hr>
    <div id="reservation-detail-alert" class="alert alert-danger d-none" role="alert"></div>

    <h5>Reservation Details</h5>
    <div class="row">
      <div class="col">
        <label class="form-label">Reservation Id</label>
        <input id="reservation-id" type="text" class="form-control" value="Loading..." disabled>
      </div>
      <div class="col">
        <label class="form-label">Status</label>
        <input id="reservation-status" type="text" class="form-control" value="Loading..." disabled>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col">
        <label class="form-label">Starting Date</label>
        <input id="reservation-start" type="text" class="form-control" value="Loading..." disabled>
      </div>
      <div class="col">
        <label class="form-label">End Date</label>
        <input id="reservation-end" type="text" class="form-control" value="Loading..." disabled>
      </div>
    </div>

    <h5 class="mt-3">Resource Details</h5>
    <div class="row">
      <div class="col">
        <label class="form-label">Resource Id</label>
        <input id="resource-id" type="text" class="form-control" value="Loading..." disabled>
      </div>
      <div class="col">
        <label class="form-label">Resource Name</label>
        <input id="resource-name" type="text" class="form-control" value="Loading..." disabled>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col">
        <label class="form-label">Resource Type</label>
        <input id="resource-type" type="text" class="form-control" value="Loading..." disabled>
      </div>
      <div class="col">
        <label class="form-label">Resource Description</label>
        <input id="resource-description" type="text" class="form-control" value="Loading..." disabled>
      </div>
    </div>

    <h5 class="mt-3">User Details</h5>
    <div class="row">
      <div class="col">
        <label class="form-label">First Name</label>
        <input id="user-first-name" type="text" class="form-control" value="Loading..." disabled>
      </div>
      <div class="col">
        <label class="form-label">Last Name</label>
        <input id="user-last-name" type="text" class="form-control" value="Loading..." disabled>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <label class="form-label">Phone Number</label>
        <input id="user-phone-number" type="text" class="form-control" value="Loading..." disabled>
      </div>
      <div class="col">
        <label class="form-label">Email</label>
        <input id="user-email" type="text" class="form-control" value="Loading..." disabled>
      </div>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-3">
      <button class="btn btn-success">Approve</button>
      <button class="btn btn-danger">Cancel</button>
    </div>
  </div>
</body>

<script type="module" src="js/detailed-reservation.js"></script>

</html>
